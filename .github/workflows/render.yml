name: render-clips

# Started by the clip intake step after it uploads a batch to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds the cut clips (*.mp4 + *.job.json)"
        required: true
      layout:
        description: "auto | stack | fullcam | gameplay (auto = decide per scene)"
        default: auto
      only:
        description: "Optional: render only these clip ids, e.g. c01,c03"
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CF_MODELS: ${{ github.workspace }}/render/models
      TAG: ${{ inputs.tag }}
      LAYOUT: ${{ inputs.layout }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt
      - name: ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation2 fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r render/requirements.txt
      - name: Face detector (YuNet, 230 KB)
        run: |
          mkdir -p render/models
          curl -fsSL -o render/models/face_detection_yunet_2023mar.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
      - name: Download the cut clips
        run: |
          mkdir -p render/in render/out
          gh release download "$TAG" --dir render/in --pattern '*.mp4' --pattern '*.job.json'
          ls -la render/in
      - name: Render vertical clips
        run: |
          ARGS=""
          if [ -n "$ONLY" ]; then ARGS="--only $ONLY"; fi
          python render/render_cli.py render/in render/out --layout "$LAYOUT" $ARGS
      - name: Attach the results to the release
        if: always()
        run: |
          rm -rf render/out/_work
          ls -la render/out
          gh release upload "$TAG" render/out/* --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-${{ inputs.tag }}
          path: render/out
          retention-days: 7